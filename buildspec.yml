version: 0.2

env:
  variables:
    IMAGE_NAME: computemesh-backend
    EC2_HOST: 13.201.129.101
    EC2_USER: ubuntu

phases:
  install:
    commands:
      - echo Installing dependencies
      - apt-get update -y
      - apt-get install -y openssh-client

  pre_build:
    commands:
      - echo Setting up SSH key
      - echo "$DEPLOY_KEY" > deploy_key
      - chmod 600 deploy_key

      - mkdir -p ~/.ssh
      - ssh-keyscan -H $EC2_HOST >> ~/.ssh/known_hosts

  build:
    commands:
      - echo Building Docker image
      - docker build -t $IMAGE_NAME .

      - echo Saving Docker image
      - docker save $IMAGE_NAME > image.tar

  post_build:
    commands:
      - echo Copying image to EC2
      - scp -o StrictHostKeyChecking=no -i deploy_key image.tar $EC2_USER@$EC2_HOST:/home/ubuntu/

      - echo Running container on EC2
      - |
        ssh -o StrictHostKeyChecking=no -i deploy_key $EC2_USER@$EC2_HOST << EOF
          set -e

          echo "Loading Docker image"
          docker load < image.tar

          echo "Stopping old container"
          docker stop computemesh || true
          docker rm computemesh || true

          echo "Starting new container"
          docker run -d \
            --restart always \
            -p 5000:5000 \
            --name computemesh \
            computemesh-backend

          rm image.tar
        EOF

artifacts:
  files:
    - '**/*'