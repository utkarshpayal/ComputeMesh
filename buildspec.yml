version: 0.2

env:
  variables:
    IMAGE_NAME: computemesh-backend
    EC2_HOST: 13.201.129.101
    EC2_USER: ubuntu

phases:

  install:
    commands:
      - apt-get update -y
      - apt-get install -y openssh-client jq

  pre_build:
    commands:
      - echo "Fetching secrets from Secrets Manager"
      - aws secretsmanager get-secret-value --secret-id DEPLOY_KEY --query SecretString --output text > secrets.json

      - export DOCKERHUB_USERNAME=$(jq -r '.DOCKERHUB_USERNAME' secrets.json)
      - export DOCKERHUB_PASSWORD=$(jq -r '.DOCKERHUB_PASSWORD' secrets.json)
      - export DEPLOY_KEY=$(jq -r '.DEPLOY_KEY' secrets.json)

      - echo "DockerHub login"
      - echo $DOCKERHUB_PASSWORD | docker login -u $DOCKERHUB_USERNAME --password-stdin

      - echo "$DEPLOY_KEY" > deploy_key
      - chmod 600 deploy_key

      - mkdir -p ~/.ssh
      - ssh-keyscan -H $EC2_HOST >> ~/.ssh/known_hosts

  build:
    commands:
      - echo "Disable BuildKit"
      - export DOCKER_BUILDKIT=0

      - echo "Pull base image"
      - docker pull node:20-alpine

      - echo "Build Docker image"
      - docker build -t $IMAGE_NAME .

      - docker save $IMAGE_NAME > image.tar

  post_build:
    commands:
      - echo "Copy image to EC2"
      - scp -o StrictHostKeyChecking=no -i deploy_key image.tar $EC2_USER@$EC2_HOST:/home/ubuntu/

      - |
        ssh -o StrictHostKeyChecking=no -i deploy_key $EC2_USER@$EC2_HOST << EOF
        docker load < image.tar
        docker stop computemesh || true
        docker rm computemesh || true

        docker run -d \
          --restart always \
          -p 5000:5000 \
          --name computemesh \
          computemesh-backend

        rm image.tar
        EOF