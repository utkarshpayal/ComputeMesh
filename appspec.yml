version: 0.0
os: linux

files:
  - source: /  # Assuming the deployment package is the whole root.
    destination: /home/ubuntu/computemesh-backend

hooks:

  ApplicationStop:
    - location: scripts/application_stop.sh  # Correct script path
      timeout: 300
      runas: ubuntu

  BeforeInstall:
    - location: scripts/before_install.sh  # Correct script path
      timeout: 300
      runas: ubuntu

  AfterInstall:
    - location: scripts/after_install.sh  # Correct script path
      timeout: 300
      runas: ubuntu

  ApplicationStart:
    - location: scripts/application_start.sh  # Correct script path
      timeout: 300
      runas: ubuntu